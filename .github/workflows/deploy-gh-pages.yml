name: Deploy to GitHub Pages

# Publishes the reviewed app and public routes from one packaged artifact.
# Public paid signup is enabled; support automation and private invitations remain off.
# Existing legacy docs and the public portrait remain on gh-pages.

on:
  push:
    branches: [main]
    paths:
      # Don't trigger on doc-only changes; broaden if needed.
      - 'src/**'
      - 'landing/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.js'
      - 'scripts/package-site.mjs'
      - 'scripts/build-credential-portal.mjs'
      - 'scripts/build-help.mjs'
      - 'scripts/sw-precache.mjs'
      - 'scripts/root-sw-retirement.js'
      - 'supabase/functions/_shared/billingCatalog.mjs'
      - '.github/workflows/deploy-gh-pages.yml'
  workflow_dispatch: {}

# Prevent overlapping deploys.
concurrency:
  group: deploy-gh-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          path: src
          fetch-depth: 1

      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: src/package-lock.json

      - name: Install deps
        working-directory: src
        run: npm ci --legacy-peer-deps

      # Gate the deploy on the tests. Until 2026-09-22 this workflow only
      # built, so a hook placed below App's early returns shipped and crashed
      # the app for every signed-in user. Nothing ran the suite or eslint.
      #
      # Scoped deliberately: the whole eslint run reports ~1,500 pre-existing
      # errors across the repo, mostly in vendored code, so it cannot gate
      # today. tests/hooks-rules.test.mjs runs the React hook rules over src,
      # which is the class that takes the app down, and it runs as part of the
      # suite below.
      #
      # PG_BIN points the two PostgreSQL integration tests at the runner's
      # server. If it is ever missing they skip with a message rather than
      # blocking a deploy over a missing tool.
      - name: Run tests
        working-directory: src
        run: |
          # Ask the runner where its PostgreSQL lives rather than pinning a
          # version that will age out. If it is not there the two integration
          # tests skip with a message instead of blocking the deploy.
          PG_BIN="$(pg_config --bindir 2>/dev/null || true)"
          echo "PG_BIN=${PG_BIN:-<not found, PostgreSQL tests will skip>}"
          PG_BIN="$PG_BIN" npm test
          # Run the new permission/transaction suite after other disposable DBs
          # have stopped, avoiding contention for local shared-memory slots.
          if [ -x "$PG_BIN/initdb" ]; then
            PG_BIN="$PG_BIN" npm run test:admin-db
          else
            echo "Admin database checks unavailable: PostgreSQL is not installed."
          fi

      # Refuse to ship a client that syncs a table production does not have.
      # A TABLE_MAP key whose table is missing fails the account load for EVERY
      # user (assertCompleteAccountRecords), so the migration must be applied
      # and verified first. This makes that ordering mechanical instead of a
      # procedure someone has to remember. It fails closed.
      - name: Check every synced table exists in production
        working-directory: src
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: node scripts/check-tables-exist.mjs

      - name: Build the app and public site
        working-directory: src
        env:
          # Supabase anon key + URL — public-safe, but stored as repo secrets
          # so the values aren't committed to git. Vite inlines anything
          # prefixed VITE_* into the client bundle at build time.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_GA4_MEASUREMENT_ID: ${{ secrets.VITE_GA4_MEASUREMENT_ID }}
          # Clerk publishable key — pk_test_* / pk_live_* are public-safe
          # (designed to ship in the client bundle). Stored as a repo secret
          # so the value isn't committed to git. Without it, ClerkProvider
          # initializes with no key and the app shows the sign-in shell with
          # no widget rendered. Set the secret in:
          #   GitHub → Settings → Secrets and variables → Actions →
          #   New repository secret → name VITE_CLERK_PUBLISHABLE_KEY
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          VITE_LIMITED_LAUNCH_ACCESS_ENABLED: "true"
          VITE_PUBLIC_SELF_SERVICE_SIGNUP_ENABLED: "true"
          VITE_CLERK_CONTINUITY_ENABLED: "true"
          VITE_SUPPORT_OPERATIONS_ENABLED: "false"
          # Administrator access. "true" turns on the owner screen AND the
          # packaged recipient page (/credential-access/). Flip only after the
          # 20260925040000 migration is applied, credential-portal is deployed
          # with its secrets, and the Cloudflare response-header rule for
          # /credential-access/* is live (docs/CREDENTIAL-PORTAL-IMPLEMENTATION.md).
          VITE_CREDENTIAL_PORTAL_ENABLED: "false"
        run: |
          node scripts/build-help.mjs --check
          npm run build:site

      - name: Sync build artifacts to gh-pages
        run: |
          set -euo pipefail

          # Replace only the routes owned by package-site; retain legacy assets.
          for route in app states locums security privacy terms help credential-access knowledge; do
            rm -rf "gh-pages/$route"
          done
          cp -R src/site-dist/. gh-pages/

      - name: Commit and push if changed
        working-directory: gh-pages
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to deploy"
            exit 0
          fi
          SHA=$(cd ../src && git rev-parse --short HEAD)
          MSG=$(cd ../src && git log -1 --pretty=%s | tr -d '"' | cut -c1-72)
          git commit -m "Auto-deploy ${SHA}: ${MSG}"
          git push origin gh-pages

      - name: Summary
        run: |
          echo "### Deploy complete" >> $GITHUB_STEP_SUMMARY
          echo "- **Source commit:** \`$(cd src && git rev-parse --short HEAD)\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Site:** https://credentialdomd.com/" >> $GITHUB_STEP_SUMMARY
          echo "- **App:** https://credentialdomd.com/app/" >> $GITHUB_STEP_SUMMARY
          echo "- **GH Pages takes 30-60s to invalidate cache after this commit lands**" >> $GITHUB_STEP_SUMMARY
